name: wommo-v24-sync

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 2.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Add new hook sources
        run: |
          set -e
          B=app/src/main/java/com/yifeplayte/wommo/hook/hooks
          mkdir -p "$B/singlepackage/thememanager"

          cat > "$B/singlepackage/Thememanager.kt" <<'EOF'
          package com.yifeplayte.wommo.hook.hooks.singlepackage

          import com.yifeplayte.wommo.hook.hooks.BasePackage

          @Suppress("unused")
          object Thememanager : BasePackage("com.android.thememanager")
          EOF

          cat > "$B/singlepackage/system/AllowThirdTheme.kt" <<'EOF'
          package com.yifeplayte.wommo.hook.hooks.singlepackage.system

          import com.yifeplayte.wommo.hook.hooks.BaseHook
          import io.github.lingqiqi5211.ezhooktool.core.loadClass
          import io.github.lingqiqi5211.ezhooktool.xposed.dsl.createHook

          @Suppress("unused")
          object AllowThirdTheme : BaseHook() {
              override val key = "allow_third_theme"
              override val isEnabled get() = true

              override fun hook() {
                  val drmManager = loadClass("miui.drm.DrmManager")
                  val drmResult = loadClass("miui.drm.DrmManager\$DrmResult")
                  val success = drmResult.getField("DRM_SUCCESS").get(null)
                  drmManager.declaredMethods
                      .filter { it.returnType == drmResult }
                      .forEach { method ->
                          method.createHook {
                              before { param -> param.result = success }
                          }
                      }
              }
          }
          EOF

          cat > "$B/singlepackage/thememanager/DisableThemeRightsCheck.kt" <<'EOF'
          package com.yifeplayte.wommo.hook.hooks.singlepackage.thememanager

          import com.yifeplayte.wommo.hook.hooks.BaseHook
          import io.github.lingqiqi5211.ezhooktool.core.loadClass
          import io.github.lingqiqi5211.ezhooktool.xposed.dsl.createHook

          @Suppress("unused")
          object DisableThemeRightsCheck : BaseHook() {
              override val key = "disable_theme_rights_check"
              override val isEnabled get() = true

              override fun hook() {
                  val drmService = loadClass("com.android.thememanager.controller.online.DrmService")
                  val drmResult = loadClass("miui.drm.DrmManager\$DrmResult")
                  val success = drmResult.getField("DRM_SUCCESS").get(null)
                  drmService.declaredMethods
                      .filter {
                          it.name == "q" &&
                              it.parameterTypes.size == 1 &&
                              it.returnType.name.contains("DrmResult")
                      }
                      .forEach { method ->
                          method.createHook {
                              before { param -> param.result = success }
                          }
                      }
              }
          }
          EOF

          cat > "$B/singlepackage/system/FrameworkExtensions.kt" <<'EOF'
          package com.yifeplayte.wommo.hook.hooks.singlepackage.system

          import android.content.Intent
          import com.yifeplayte.wommo.hook.hooks.BaseHook
          import io.github.lingqiqi5211.ezhooktool.core.findAllMethods
          import io.github.lingqiqi5211.ezhooktool.core.loadClass
          import io.github.lingqiqi5211.ezhooktool.xposed.dsl.createHooks

          @Suppress("unused")
          object FrameworkExtensions : BaseHook() {
              override val key = "framework_extensions"
              override val isEnabled get() = true

              private val blackListFields = listOf(
                  "FREEFORM_BLACK_LIST",
                  "ABNORMAL_FREEFORM_BLACK_LIST",
                  "START_FROM_FREEFORM_BLACK_LIST_ACTIVITY",
                  "FOREGROUND_PIN_APP_BLACK_LIST",
              )

              private val blackListMethods = listOf(
                  "getFreeformBlackList",
                  "getFreeformBlackListFromCloud",
                  "getAbnormalFreeformBlackList",
                  "getAbnormalFreeformBlackListFromCloud",
                  "getStartFromFreeformBlackList",
                  "getStartFromFreeformBlackListFromCloud",
                  "getForegroundPinAppBlackList",
                  "getForegroundPinAppBlackListFromCloud",
              )

              override fun hook() {
                  runCatching { hookFreeformBlackList() }
                  runCatching { hookFreeformCount() }
                  runCatching { hookAppLinkVerify() }
                  runCatching { hookMarketRedirect() }
                  runCatching { hookDownloadsRedirect() }
              }

              private fun hookFreeformBlackList() {
                  val adapter = loadClass("android.util.MiuiMultiWindowAdapter")
                  blackListFields.forEach { fieldName ->
                      runCatching {
                          adapter.getDeclaredField(fieldName).apply { isAccessible = true }
                              .get(null)
                              ?.let { (it as? MutableCollection<*>)?.clear() }
                      }
                  }
                  blackListMethods.forEach { methodName ->
                      adapter.findAllMethods { name(methodName) }.createHooks {
                          returnConstant(emptyList<String>())
                      }
                  }
              }

              private fun hookFreeformCount() {
                  loadClass("com.android.server.wm.MiuiFreeFormStackDisplayStrategy")
                      .findAllMethods { name("getMaxMiuiFreeFormStackCount") }
                      .createHooks { returnConstant(256) }
              }

              private fun hookAppLinkVerify() {
                  loadClass("com.android.server.pm.verify.domain.DomainVerificationUtils")
                      .findAllMethods { name("isDomainVerificationIntent") }
                      .createHooks { returnConstant(false) }
              }

              private fun hookMarketRedirect() {
                  loadClass("com.android.server.wm.ActivityTaskManagerService")
                      .findAllMethods { name("startActivity") }
                      .createHooks {
                          before { param ->
                              val args = param.args
                              val index = args.indexOfFirst { it is Intent }
                              if (index < 0) return@before
                              val intent = args[index] as? Intent ?: return@before
                              if (intent.action != Intent.ACTION_VIEW) return@before
                              val data = intent.data ?: return@before
                              val scheme = data.scheme
                              if (scheme != "market" && scheme != "mimarket") return@before
                              if (data.host != "details") return@before
                              if (data.getQueryParameter("id") == null) return@before
                              val newIntent = Intent(intent)
                              newIntent.setDataAndType(
                                  data.buildUpon().scheme("market").path("/detailmini").build(),
                                  intent.type
                              )
                              newIntent.setPackage(null)
                              newIntent.removeFlags(Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                              args[index] = Intent.createChooser(newIntent, null)
                          }
                      }
              }

              private fun hookDownloadsRedirect() {
                  loadClass("com.android.server.wm.ActivityStartController")
                      .findAllMethods { name("startActivityInPackage") }
                      .createHooks {
                          before { param ->
                              val args = param.args
                              val index = args.indexOfFirst { it is Intent }
                              if (index < 0) return@before
                              val intent = args[index] as? Intent ?: return@before
                              if (intent.action != "android.intent.action.VIEW_DOWNLOADS") return@before
                              val newIntent = Intent(intent)
                              newIntent.setPackage(null)
                              args[index] = Intent.createChooser(newIntent, null)
                          }
                      }
              }
          }
          EOF
      - name: Patch upstream hooks
        run: |
          set -e
          python3 - <<'PY'
          import pathlib

          B = pathlib.Path("app/src/main/java/com/yifeplayte/wommo/hook/hooks")


          def replace_block(src, signature, new_block):
              start = src.index(signature)
              i = src.index("{", start)
              depth = 0
              end = -1
              for j in range(i, len(src)):
                  if src[j] == "{":
                      depth += 1
                  elif src[j] == "}":
                      depth -= 1
                      if depth == 0:
                          end = j + 1
                          break
              assert end > 0, signature
              return src[:start] + new_block + src[end:]


          # 1) ShowNotificationImportance: systemUi() 改挂 StackCoordinator 新 hook 点
          p = B / "multipackage/ShowNotificationImportance.kt"
          src = p.read_text(encoding="utf-8")
          new_system_ui = r'''private fun systemUi() {
              loadClass("com.android.systemui.statusbar.notification.collection.coordinator.StackCoordinator\$attach\$1")
                  .findMethod { name("onAfterRenderList") }
                  .createHook {
                      before { param ->
                          val entries = param.args[0] as? MutableList<Any?> ?: return@before
                          if (entries.isEmpty()) return@before
                          val filtered = ArrayList<Any?>()
                          entries.forEach { entry ->
                              val representative =
                                  entry?.callMethod("getRepresentativeEntry") ?: return@forEach
                              val ranking = representative.getFieldOrNull("mRanking") ?: return@forEach
                              val importance = ranking.callMethod("getImportance") as? Int ?: return@forEach
                              if (importance > 1) filtered.add(entry)
                          }
                          if (filtered.size != entries.size) {
                              param.args[0] = filtered
                          }
                      }
                  }
          }'''
          src = replace_block(src, "private fun systemUi() {", new_system_ui)
          p.write_text(src, encoding="utf-8")

          # 2) NotificationSettingsNoWhiteList: 反射写 static final 改为 hook canNotificationSlide
          p = B / "singlepackage/systemui/NotificationSettingsNoWhiteList.kt"
          p.write_text(r'''package com.yifeplayte.wommo.hook.hooks.singlepackage.systemui

          import com.yifeplayte.wommo.hook.hooks.BaseHook
          import io.github.lingqiqi5211.ezhooktool.core.findMethod
          import io.github.lingqiqi5211.ezhooktool.core.getFieldOrNull
          import io.github.lingqiqi5211.ezhooktool.core.loadClass
          import io.github.lingqiqi5211.ezhooktool.core.putField
          import io.github.lingqiqi5211.ezhooktool.xposed.dsl.createHook

          @Suppress("unused")
          object NotificationSettingsNoWhiteList : BaseHook() {
              override val key = "notification_settings_no_white_list"
              override val isEnabled get() = true

              override fun hook() {
                  loadClass("com.android.systemui.statusbar.notification.policy.AppMiniWindowManagerImpl")
                      .findMethod { name("canNotificationSlide") }
                      .createHook {
                          before { param ->
                              val settingsManager =
                                  param.thisObject.getFieldOrNull("notificationSettingsManager") ?: return@before
                              val allowAll = object : ArrayList<Any?>() {
                                  override fun contains(element: Any?): Boolean = true
                              }
                              settingsManager.putField("mAllowNotificationSlide", allowAll)
                              settingsManager.putField("mAllowNotificationSlideLocal", allowAll)
                          }
                      }
              }
          }
          ''', encoding="utf-8")
          print("patched: ShowNotificationImportance, NotificationSettingsNoWhiteList")
          PY
      - name: Add notification and security hooks
        run: |
          set -e
          B=app/src/main/java/com/yifeplayte/wommo/hook/hooks

          cat > "$B/singlepackage/settings/AllowManageAllNotifications.kt" <<'EOF'
          package com.yifeplayte.wommo.hook.hooks.singlepackage.settings

          import com.yifeplayte.wommo.hook.hooks.BaseHook
          import io.github.lingqiqi5211.ezhooktool.core.findAllMethods
          import io.github.lingqiqi5211.ezhooktool.core.findMethod
          import io.github.lingqiqi5211.ezhooktool.core.loadClass
          import io.github.lingqiqi5211.ezhooktool.xposed.dsl.createHook
          import io.github.lingqiqi5211.ezhooktool.xposed.dsl.createHooks

          @Suppress("unused")
          object AllowManageAllNotifications : BaseHook() {
              override val key = "allow_manage_all_notifications"
              override val isEnabled get() = true

              private val settingsClasses = arrayOf(
                  "com.android.settings.notification.app.AppNotificationSettings",
                  "com.android.settings.notification.app.ChannelNotificationSettings",
                  "com.android.settings.notification.AppNotificationSettings",
                  "com.android.settings.notification.ChannelNotificationSettings",
              )

              override fun hook() {
                  settingsClasses.forEach { className ->
                      runCatching {
                          loadClass(className)
                              .findAllMethods { name("setupBlock") }
                              .createHooks {
                                  after { param ->
                                      runCatching { enableBlockPreference(param.thisObject) }
                                  }
                              }
                      }
                  }
                  runCatching {
                      val channel = loadClass("android.app.NotificationChannel")
                      channel.findMethod { name("isBlockable") }.createHook {
                          before { param -> param.result = true }
                      }
                      channel.findAllMethods { name("setBlockable") }.createHooks {
                          before { param -> param.args[0] = true }
                      }
                  }
              }

              private fun enableBlockPreference(fragment: Any) {
                  val findPreference = fragment.javaClass.methods.firstOrNull {
                      it.name == "findPreference" && it.parameterCount == 1
                  } ?: return
                  val preference = findPreference.invoke(fragment, "block") ?: return
                  preference.javaClass
                      .getMethod("setEnabled", Boolean::class.javaPrimitiveType!!)
                      .invoke(preference, true)
              }
          }
          EOF

