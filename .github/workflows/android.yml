                              java.lang.Boolean.TYPE,
                              String::class.java
                          )
                      }
                      ?.createHook {
                          before { param ->
                              val ctx = param.args[0] as? Context ?: return@before
                              val safeDir = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "xl")
                              param.args[2] = File(safeDir, "dp.log").absolutePath
                          }
                      }

                  // 兜底：任何仍指向根目录 .xlDownload 的建目录请求一律拒绝
                  loadClass("com.android.providers.downloads.util.FileUtil")
                      .findMethodOrNull {
                          name("createFile")
