          assert src != before, "AddOpenByDefaultEntry patch not applied"
          p.write_text(src, encoding="utf-8")
          print("AddOpenByDefaultEntry: initView/onClick made null-safe")
          PY

      - name: Rewrite RemoveXlDownload
        run: |
          set -e
          cat > "app/src/main/java/com/yifeplayte/wommo/hook/hooks/singlepackage/downloadprovider/RemoveXlDownload.kt" <<'EOF'
          package com.yifeplayte.wommo.hook.hooks.singlepackage.downloadprovider

          import android.content.Context
          import com.yifeplayte.wommo.hook.hooks.BaseHook
          import io.github.lingqiqi5211.ezhooktool.core.findMethodOrNull
          import io.github.lingqiqi5211.ezhooktool.core.loadClass
          import io.github.lingqiqi5211.ezhooktool.xposed.dsl.createHook
          import java.io.File

          @Suppress("unused")
          object RemoveXlDownload : BaseHook() {
              override val key = "remove_xl_download"

              override fun hook() {
                  // 把迅雷引擎日志目录从 /storage/emulated/0/.xlDownload 改到应用私有目录
                  loadClass("com.android.providers.downloads.config.XLConfig")
                      .findMethodOrNull {
