                  // 云端参数侧：guardprovider 被卸载/网络被拦时不再判为“新未注册”
                  runCatching {
                      loadClass("com.miui.packageInstaller.model.CloudParams")
                          .findAllMethods { name("isNewUnregistered") }
                          .createHooks {
                              before { param -> param.result = false }
                          }
                  }
              }
          }
          EOF
      - name: Patch upstream hooks (channel + menu)
        run: |
          set -e
          python3 - <<'PY'
          import pathlib

          B = pathlib.Path("app/src/main/java/com/yifeplayte/wommo/hook/hooks")


          def replace_block(src, signature, new_block):
              start = src.index(signature)
              i = src.index("{", start)
              depth = 0
              end = -1
              for j in range(i, len(src)):
                  if src[j] == "{":
                      depth += 1
                  elif src[j] == "}":
                      depth -= 1
                      if depth == 0:
                          end = j + 1
                          break
              assert end > 0, signature
              return src[:start] + new_block + src[end:]


          # 3) RedirectToNotificationChannelSetting: 四段式改单段自包含
          p = B / "singlepackage/systemui/RedirectToNotificationChannelSetting.kt"
          src = p.read_text(encoding="utf-8")
          new_hook = r'''override fun hook() {
              loadClass("com.miui.systemui.notification.NotificationSettingsHelper")
                  .findMethod {
                      name("startAppNotificationSettings")
                      params(
                          Context::class.java,
                          String::class.java,
                          String::class.java,
                          Int::class.javaPrimitiveType!!,
                          String::class.java
                      )
                  }
                  .createHook {
                      before { param ->
                          val args = param.args
                          val pkg = args[1] as? String ?: return@before
                          val uid = args[3] as? Int ?: return@before
                          val channelId = args[4] as? String ?: return@before
                          val intent = Intent(Intent.ACTION_MAIN).apply {
                              addFlags(Intent.FLAG_ACTIVITY_CLEAR_TASK)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              setClassName("com.android.settings", "com.android.settings.SubSettings")
                              putExtra(
                                  ":android:show_fragment",
                                  "com.android.settings.notification.ChannelNotificationSettings"
                              )
                              putExtra(Settings.EXTRA_APP_PACKAGE, pkg)
                              putExtra(Settings.EXTRA_CHANNEL_ID, channelId)
                              putExtra("app_uid", uid)
                          }
                          val userHandleCurrent =
                              UserHandle::class.java.getStaticFieldOrNullAs<Any?>("CURRENT")
                          EzXposed.appContext.callMethod("startActivityAsUser", intent, userHandleCurrent)
                          param.result = null
                      }
                  }
          }'''
          src = replace_block(src, "override fun hook() {", new_hook)
          p.write_text(src, encoding="utf-8")

          # 4) AddOpenByDefaultEntry: 追加菜单项与点击处理
          p = B / "singlepackage/securitycenter/AddOpenByDefaultEntry.kt"
          src = p.read_text(encoding="utf-8")
          if "import android.view.Menu\n" not in src:
              src = src.replace(
                  "import android.view.View\n",
                  "import android.view.Menu\nimport android.view.MenuItem\nimport android.view.View\n",
                  1,
              )
          if "OPEN_BY_DEFAULT_MENU_ID" not in src:
              src = src.replace(
                  'override val key = "add_open_by_default_entry"',
                  'override val key = "add_open_by_default_entry"\n'
                  "private const val OPEN_BY_DEFAULT_MENU_ID = 235864065",
                  1,
              )
          anchor = 'loadClass("com.miui.appmanager.ApplicationsDetailsActivity")'
          assert anchor in src
          nl = src.index("\n", src.index(anchor)) + 1
          extra = r'''
              clazzApplicationsDetailsActivity.findMethod {
                  name("onCreateOptionsMenu")
                  params(Menu::class.java)
              }.createHook {
                  after { param ->
                      val menu = param.args[0] as? Menu ?: return@after
                      if (menu.findItem(OPEN_BY_DEFAULT_MENU_ID) == null) {
                          menu.add(0, OPEN_BY_DEFAULT_MENU_ID, 0, "默认打开")
                      }
                  }
              }

              clazzApplicationsDetailsActivity.findMethod {
                  name("onOptionsItemSelected")
                  params(MenuItem::class.java)
              }.createHook {
                  before { param ->
                      val item = param.args[0] as? MenuItem ?: return@before
                      if (item.itemId != OPEN_BY_DEFAULT_MENU_ID) return@before
                      val activity = param.thisObject as? Activity ?: return@before
                      startActionAppOpenByDefaultSettings(activity)
                      param.result = true
                  }
              }
          '''
          src = src[:nl] + extra + src[nl:]
          p.write_text(src, encoding="utf-8")
          print("patched: RedirectToNotificationChannelSetting, AddOpenByDefaultEntry")
          PY
      - name: Fix AddOpenByDefaultEntry null-safe
        run: |
          set -e
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path(
              "app/src/main/java/com/yifeplayte/wommo/hook/hooks/"
              "singlepackage/securitycenter/AddOpenByDefaultEntry.kt"
          )
