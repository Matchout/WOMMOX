      - name: Add AddOpenByDefaultMenuEntry
        run: |
          set -e
          cat > "app/src/main/java/com/yifeplayte/wommo/hook/hooks/singlepackage/securitycenter/AddOpenByDefaultMenuEntry.kt" <<'EOF'
          package com.yifeplayte.wommo.hook.hooks.singlepackage.securitycenter

          import android.app.Activity
          import android.content.Intent
          import android.provider.Settings
          import androidx.core.net.toUri
          import android.view.Menu
          import android.view.MenuItem
          import com.yifeplayte.wommo.hook.hooks.BaseHook
          import io.github.lingqiqi5211.ezhooktool.core.findMethodOrNull
          import io.github.lingqiqi5211.ezhooktool.core.loadClass
          import io.github.lingqiqi5211.ezhooktool.xposed.dsl.createHook

          @Suppress("unused")
          object AddOpenByDefaultMenuEntry : BaseHook() {
              override val key = "add_open_by_default_entry"

              private const val MENU_ID = 235864065

              private fun openByDefaultSettings(activity: Activity) {
                  val pkgName = activity.intent.getStringExtra("package_name") ?: return
                  val intent = Intent().apply {
                      action = Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS
                      addCategory(Intent.CATEGORY_DEFAULT)
                      data = "package:$pkgName".toUri()
                      addFlags(Intent.FLAG_ACTIVITY_NO_HISTORY)
                      addFlags(Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS)
                  }
                  activity.startActivity(intent)
              }

              override fun hook() {
                  val clazz = loadClass("com.miui.appmanager.ApplicationsDetailsActivity")

                  val createMenu = clazz.findMethodOrNull {
                      name("onCreateOptionsMenu")
                      params(Menu::class.java)
                  }
                  if (createMenu != null) {
                      createMenu.createHook {
                          after { param ->
                              val menu = param.args[0] as? Menu
                              if (menu != null && menu.findItem(MENU_ID) == null) {
                                  menu.add(0, MENU_ID, 0, "默认打开")
                              }
                          }
                      }
                  }

                  val selectItem = clazz.findMethodOrNull {
                      name("onOptionsItemSelected")
                      params(MenuItem::class.java)
                  }
                  if (selectItem != null) {
                      selectItem.createHook {
                          before { param ->
                              val item = param.args[0] as? MenuItem
                              if (item != null && item.itemId == MENU_ID) {
                                  val activity = param.thisObject as? Activity
                                  if (activity != null) {
                                      openByDefaultSettings(activity)
                                      param.result = true
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF
          echo "AddOpenByDefaultMenuEntry.kt added"

